name: storeflow_pos
description: "StoreFlow POS — Offline Point of Sale & Inventory Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  # SQLite is bundled into the application by package:sqlite3 3.x itself, using
  # Dart's native-assets (code assets) feature. That feature must be enabled on
  # the build machine: `flutter config --enable-native-assets`. It is on by
  # default on the stable channel, but a machine that disabled it produces an
  # APK with no libsqlite3.so, which crashes at the first query with
  # "Couldn't resolve native function 'sqlite3_initialize'".
  #
  # sqlite3_flutter_libs is deliberately NOT a dependency. From 0.6.0 it is an
  # empty no-op ("Not used anymore, update to version 3.x of package:sqlite3"),
  # so depending on it looks like it bundles SQLite when it does nothing.
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  window_manager: ^0.6.0
  # AES-256-GCM and Argon2id arrive in Phase 9 through the `cryptography`
  # package; `pointycastle`/`crypto` were dropped until a code path needs them.
  cryptography: ^2.9.0
  esc_pos_utils_plus: ^2.0.4
  # `image` is added in Phase 7, where Arabic receipts are rendered to a raster
  # bitmap before being sent to the printer.
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation for Drift. `freezed`, `json_serializable` and `mocktail`
  # are intentionally absent: no source file uses them yet, and the tests
  # deliberately avoid mocks. Add them in the Phase that first needs them.
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/receipts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

# `path_provider_android` 2.3.0+ pulls in the `jni` plugin, whose CMake build
# still targets the `armeabi` ABI. The Android NDK that Flutter 3.47 defaults to
# (28.2.13676358) removed that ABI and fails the build with
# "armeabi is no longer supported. Use armeabi-v7a." Pinning to the last release
# before that dependency was introduced keeps the Android build working without
# disabling any architecture we ship.
dependency_overrides:
  path_provider_android: 2.2.23
