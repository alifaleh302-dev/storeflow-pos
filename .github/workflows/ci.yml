name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # SQLite reaches Android as a Dart native asset. Turn the feature on
      # explicitly rather than relying on the channel default, so the APK check
      # in the other job is meaningful.
      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      # `flutter test` builds the native-asset hooks for the host. One of the
      # transitive packages (cnativeapi) needs the GTK/X11 development headers,
      # which the runner image does not guarantee.
      - name: Install host libraries for native-asset hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxi-dev libx11-dev pkg-config ninja-build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK and verify native libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      # No keystore is available here, so this build is debug-signed and is NOT
      # a publishable artifact. It exists to prove the SQLite native asset is
      # bundled. A real release is signed locally with android/key.properties
      # and built with -Prequire.release.signing=true; see docs/installation.md.
      - name: Build APK
        run: flutter build apk --release

      # Fails the job if libsqlite3.so is missing or does not export the entry
      # point the FFI bindings look up. This is the regression guard for the
      # crash the application shipped with. It also prints the signing
      # certificate so the debug-signed status is visible in the log.
      - name: Verify the APK bundles SQLite
        run: scripts/verify_apk_native_libs.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK (debug-signed, for verification only)
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-pos-apk-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
